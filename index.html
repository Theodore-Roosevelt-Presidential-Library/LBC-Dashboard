<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRPL · Living Building Challenge — Live</title>
<style>
  :root{
    --bg:#0d1417; --panel:rgba(20,31,33,.72); --panel-solid:#141f21; --line:rgba(201,162,74,.22);
    --line2:#2a3a3c; --text:#f4efe3; --muted:#a9bab0; --gold:#d7ad52;
    --solar:#f0b64e; --geo:#e07b3c; --draw:#7ea093; --water:#57b0d6;
    --place:#88b866; --health:#5fcbab; --materials:#c69664; --equity:#9a86e0; --beauty:#e084b0;
    --good:#63c982; --warn:#e0a94a;
    --font:"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--font);overflow:hidden}

  .app{height:100vh;width:100vw;display:grid;grid-template-rows:auto 1fr auto;position:relative}

  /* ---------- HEADER ---------- */
  .top{display:flex;justify-content:space-between;align-items:center;
    padding:clamp(12px,1.9vh,24px) clamp(20px,2.6vw,50px);z-index:20;
    background:linear-gradient(180deg,rgba(8,13,15,.9),rgba(8,13,15,0))}
  .brand{display:flex;flex-direction:column;gap:clamp(5px,.9vh,11px)}
  .logo{height:clamp(28px,4.2vh,54px);width:auto;display:block}
  .brandsub{display:flex;align-items:center;gap:11px;font-size:clamp(10px,.92vw,14px);color:var(--muted);font-weight:600;letter-spacing:.05em}
  .demo-badge{font-size:clamp(8px,.58vw,10px);text-transform:uppercase;letter-spacing:.12em;color:var(--gold);border:1px solid rgba(215,173,82,.4);border-radius:20px;padding:2px 9px;font-weight:700}
  .clock{text-align:right}
  .clock .lv{font-size:clamp(8px,.6vw,11px);color:var(--muted);text-transform:uppercase;letter-spacing:.16em}
  .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--good);margin-right:6px;animation:pulse 2.4s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(99,201,130,.6)}70%{box-shadow:0 0 0 7px rgba(99,201,130,0)}100%{box-shadow:0 0 0 0 rgba(99,201,130,0)}}
  .clock .t{font-size:clamp(18px,1.5vw,26px);font-weight:600;font-variant-numeric:tabular-nums}
  .clock .d{color:var(--muted);font-size:clamp(10px,.72vw,13px)}

  /* ---------- STAGE (scenery + KPIs) ---------- */
  .stage{position:relative;overflow:hidden}
  .scene{position:absolute;inset:0;overflow:hidden;z-index:0}
  .scene .layer{position:absolute;inset:0;pointer-events:none}
  .sky{position:absolute;inset:0;z-index:0;background:#12222a;transition:background 3s linear}
  .stars{position:absolute;inset:0;z-index:1;opacity:0;transition:opacity 3s linear}
  .star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--td,4s) ease-in-out infinite alternate}
  @keyframes twinkle{from{opacity:.12}to{opacity:.95}}
  .clouds{position:absolute;inset:0;z-index:2;overflow:hidden}
  .cloud{position:absolute;border-radius:100px;filter:blur(7px);will-change:transform;animation:drift linear infinite}
  @keyframes drift{from{transform:translateX(-38vw)}to{transform:translateX(138vw)}}
  .celestial{position:absolute;inset:0;z-index:3;overflow:hidden;transition:opacity 3s linear}
  .orb{position:absolute;border-radius:50%;transform:translate(-50%,-50%)}
  .scene .terrain{position:absolute;inset:0;z-index:4}
  .scene .terrain svg{width:100%;height:100%;display:block}
  .precip{position:absolute;inset:0;z-index:5;overflow:hidden;transform-origin:50% 40%;transition:transform 2s ease}
  .drop{position:absolute;top:-16%;width:1.5px;border-radius:2px;background:linear-gradient(transparent,rgba(176,200,226,.72));will-change:transform;animation:fall linear infinite}
  @keyframes fall{to{transform:translateY(130vh)}}
  .flake{position:absolute;top:-10%;border-radius:50%;background:#eef4f8;will-change:transform;animation:snowfall linear infinite}
  @keyframes snowfall{to{transform:translateY(130vh) translateX(var(--dx,18px))}}
  .fog{position:absolute;inset:0;z-index:6;opacity:0;transition:opacity 3s linear;background:linear-gradient(180deg,rgba(198,203,203,0) 22%,rgba(204,208,208,.5) 100%)}
  .flash{position:absolute;inset:0;z-index:7;background:#eaf0ff;opacity:0}
  .flash.zap{animation:zap .8s ease-out}
  @keyframes zap{0%{opacity:0}5%{opacity:.85}11%{opacity:.15}17%{opacity:.72}28%{opacity:0}100%{opacity:0}}
  .wx-chip{position:absolute;left:clamp(20px,2.6vw,50px);bottom:clamp(10px,2vh,26px);z-index:10;
    display:flex;align-items:center;gap:10px;background:var(--panel);backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;
    padding:8px 14px;box-shadow:0 8px 24px rgba(0,0,0,.32)}
  .wx-chip .ic{font-size:clamp(15px,1.3vw,20px)}
  .wx-chip .tp{font-weight:700;font-variant-numeric:tabular-nums;font-size:clamp(12px,1vw,16px)}
  .wx-chip .ds{color:var(--muted);font-size:clamp(9px,.72vw,12px);text-transform:uppercase;letter-spacing:.08em}

  .kpis{position:relative;z-index:10;height:100%;display:grid;
    grid-template-columns:repeat(4,1fr);gap:clamp(12px,1.4vw,26px);
    align-items:start;padding:clamp(14px,2.2vh,30px) clamp(20px,2.6vw,50px) 0}
  .kpi{background:var(--panel);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px);
    border:1px solid var(--line);border-top:2px solid var(--kc,var(--gold));border-radius:14px;
    padding:clamp(12px,1.6vh,20px) clamp(14px,1.4vw,24px);box-shadow:0 12px 34px rgba(0,0,0,.35)}
  .kpi .lbl{font-size:clamp(9px,.7vw,12px);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;display:flex;align-items:center;gap:7px}
  .kpi .sw{width:10px;height:10px;border-radius:3px;display:inline-block;background:var(--kc)}
  .kpi .val{font-size:clamp(30px,3.6vw,64px);font-weight:700;line-height:.98;font-variant-numeric:tabular-nums;margin-top:clamp(4px,.8vh,10px)}
  .kpi .val .u{font-size:clamp(12px,1vw,20px);color:var(--muted);font-weight:500;margin-left:5px}
  .kpi .foot{font-size:clamp(9px,.72vw,13px);color:var(--muted);margin-top:6px}
  .kpi .track{position:relative;height:8px;background:rgba(0,0,0,.3);border-radius:5px;overflow:hidden;margin-top:10px}
  .kpi .track .fill{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--kc);transition:width 1s ease}
  .kpi .track .tgt{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;opacity:.7}
  .headline-strip{position:absolute;left:50%;bottom:clamp(10px,2vh,26px);transform:translateX(-50%);z-index:10;
    text-align:center;color:var(--text);text-shadow:0 2px 14px rgba(0,0,0,.7)}
  .headline-strip .big{font-size:clamp(16px,1.5vw,24px);font-weight:700}
  .headline-strip .big b{color:var(--good)}
  .headline-strip .hint{font-size:clamp(9px,.72vw,12px);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:4px}

  /* ---------- PETAL RAIL ---------- */
  .rail{display:grid;grid-template-columns:repeat(7,1fr);gap:clamp(8px,.8vw,16px);
    padding:clamp(10px,1.4vh,18px) clamp(20px,2.6vw,50px) clamp(14px,1.8vh,24px);z-index:20;
    background:linear-gradient(0deg,rgba(8,13,15,.96),rgba(8,13,15,.4))}
  .petal-tile{background:var(--panel-solid);border:1px solid var(--line2);border-radius:13px;color:var(--text);
    padding:clamp(9px,1.3vh,16px) clamp(8px,.8vw,15px);cursor:pointer;position:relative;overflow:hidden;
    transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease,background .16s ease;text-align:left}
  .petal-tile:hover{transform:translateY(-4px);border-color:var(--pc);box-shadow:0 10px 26px -6px var(--pc)}
  .petal-tile.active{border-color:var(--pc);
    background:linear-gradient(180deg,color-mix(in srgb,var(--pc) 22%,var(--panel-solid)),var(--panel-solid));
    box-shadow:0 -3px 0 0 var(--pc) inset,0 12px 30px -8px var(--pc);transform:translateY(-4px)}
  .petal-tile.active .nm{color:var(--pc)}
  .petal-tile.dimmed{opacity:.5}
  .petal-tile.dimmed:hover{opacity:1}
  .petal-tile .accent{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pc)}
  .petal-tile.active .accent{width:6px;box-shadow:0 0 12px var(--pc)}
  .petal-tile .row1{display:flex;align-items:center;gap:9px}
  .petal-tile .ic{font-size:clamp(16px,1.5vw,24px)}
  .petal-tile .nm{font-size:clamp(10px,.82vw,14px);font-weight:700;line-height:1.05;color:var(--text)}
  .petal-tile .big{font-size:clamp(18px,1.9vw,32px);font-weight:700;color:var(--pc);font-variant-numeric:tabular-nums;margin-top:clamp(3px,.8vh,8px);line-height:1}
  .petal-tile .st{font-size:clamp(8px,.62vw,10.5px);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:5px}
  .petal-tile .st .live{color:var(--good)}
  .petal-tile .mini{height:6px;border-radius:4px;background:rgba(0,0,0,.3);overflow:hidden;margin-top:8px;position:relative}
  .petal-tile .mini i{position:absolute;inset:0 auto 0 0;background:var(--pc);border-radius:4px}

  /* ---------- DETAIL OVERLAY ---------- */
  .detail{position:absolute;inset:0;z-index:15;background:linear-gradient(180deg,#0d1417 0%,#0f1c1e 100%);
    display:none;flex-direction:column;overflow:hidden}
  .detail.open{display:flex}
  .d-scene{position:absolute;left:0;right:0;bottom:0;height:34%;z-index:0;opacity:.5}
  .d-scene svg{width:100%;height:100%}
  .d-top{display:flex;align-items:center;gap:18px;padding:clamp(14px,2.2vh,26px) clamp(22px,3vw,54px) 0;z-index:5}
  .back{background:var(--panel-solid);border:1px solid var(--line2);color:var(--text);font-family:var(--font);
    font-size:clamp(11px,.8vw,14px);padding:9px 16px;border-radius:10px;cursor:pointer}
  .back:hover{border-color:var(--gold)}
  .bubble{width:clamp(44px,3.4vw,64px);height:clamp(44px,3.4vw,64px);border-radius:50% 50% 50% 10px;
    display:flex;align-items:center;justify-content:center;font-size:clamp(22px,2vw,32px)}
  .d-top h2{font-size:clamp(18px,1.8vw,30px);font-weight:700}
  .d-tag{font-size:clamp(9px,.66vw,12px);padding:3px 11px;border-radius:20px;font-weight:600;margin-left:10px;vertical-align:middle}
  .d-tag.live{background:rgba(99,201,130,.16);color:var(--good);border:1px solid rgba(99,201,130,.4)}
  .d-tag.cap{background:rgba(87,176,214,.16);color:var(--water);border:1px solid rgba(87,176,214,.4)}
  .d-tag.doc{background:rgba(169,186,176,.14);color:var(--muted);border:1px solid rgba(169,186,176,.3)}
  .d-body{flex:1;overflow-y:auto;padding:clamp(10px,1.6vh,20px) clamp(22px,3vw,54px) clamp(20px,3vh,40px);z-index:5}
  .imps{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
  .imp{font-size:clamp(9px,.66vw,12px);background:var(--panel-solid);border:1px solid var(--line2);color:var(--muted);padding:4px 11px;border-radius:20px}
  .tagline{color:var(--muted);font-size:clamp(12px,.95vw,16px);max-width:60vw;line-height:1.5;margin:8px 0 6px}
  .seclabel{font-size:clamp(9px,.7vw,12px);text-transform:uppercase;letter-spacing:.16em;color:var(--gold);margin:clamp(14px,2vh,24px) 0 12px;font-weight:700}
  .cols{display:grid;grid-template-columns:1.5fr 1fr;gap:clamp(16px,2vw,34px)}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:clamp(10px,1vw,16px)}
  .card{background:var(--panel-solid);border:1px solid var(--line2);border-radius:13px;padding:clamp(12px,1.4vh,18px)}
  .card .lbl{font-size:clamp(9px,.7vw,12px);color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
  .card .val{font-size:clamp(22px,2.2vw,32px);font-weight:700;font-variant-numeric:tabular-nums;margin-top:7px;line-height:1}
  .card .val .u{font-size:clamp(11px,.9vw,14px);color:var(--muted);font-weight:500;margin-left:4px}
  .card .foot{font-size:clamp(9px,.7vw,12px);color:var(--muted);margin-top:6px;line-height:1.4}
  .bar{position:relative;height:15px;background:rgba(0,0,0,.3);border:1px solid var(--line2);border-radius:8px;overflow:hidden;margin-top:11px}
  .bar .fill{position:absolute;inset:0 auto 0 0;border-radius:8px;transition:width 1s ease}
  .track-list{list-style:none;display:grid;gap:8px}
  .track-list li{font-size:clamp(11px,.86vw,14px);padding:8px 0;border-bottom:1px dashed var(--line2);display:flex;gap:9px;align-items:flex-start}
  .track-list li .dot{color:var(--pc);font-weight:800}
  .track-list li .k{color:var(--muted)}
  .show-box{background:var(--panel-solid);border:1px solid var(--line2);border-left:3px solid var(--pc);
    border-radius:12px;padding:clamp(12px,1.4vh,18px);font-size:clamp(12px,.92vw,15px);line-height:1.6;margin-top:8px}
  .show-box strong{color:var(--pc)}
  .src-note{color:var(--muted);font-size:clamp(9px,.7vw,12px);margin-top:14px}
</style>
</head>

/* ================= SKY / SUN / WEATHER ENGINE =================
   Time-of-day drives the sky, sun/moon arc and stars; live Medora
   weather (Open-Meteo, no API key) drives clouds, precip, fog, storms. */
const GEO={lat:46.9139,lon:-103.5236,tz:'America/Chicago'};
let WXDATA=null, sunTimes={rise:390,set:1289};   // default 06:30 / 21:29 (minutes)

function buildScene(){
  const s=document.getElementById('scene');
  s.innerHTML=`
    <div class="sky" id="sky"></div>
    <div class="stars layer" id="stars"></div>
    <div class="clouds layer" id="clouds"></div>
    <div class="celestial layer" id="celestial"></div>
    <div class="terrain">${terrainSVG()}</div>
    <div class="precip layer" id="precip"></div>
    <div class="fog layer" id="fog"></div>
    <div class="flash" id="flash"></div>`;
  let h='';
  for(let i=0;i<90;i++){
    const x=(Math.random()*100).toFixed(2), y=(Math.random()*46).toFixed(2);
    const sz=Math.random()<0.15?2.2:1.3, d=(2+Math.random()*4).toFixed(1);
    h+=`<div class="star" style="left:${x}%;top:${y}%;width:${sz}px;height:${sz}px;--td:${d}s;animation-delay:${(Math.random()*4).toFixed(1)}s"></div>`;
  }
  document.getElementById('stars').innerHTML=h;
}

function minsFromISO(t){ const m=/T(\d\d):(\d\d)/.exec(t); return m?(+m[1]*60 + +m[2]):null; }
function medoraMinutes(){
  const p=new Intl.DateTimeFormat('en-US',{timeZone:GEO.tz,hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
  let hh=+p.find(x=>x.type==='hour').value, mm=+p.find(x=>x.type==='minute').value;
  if(hh===24)hh=0; return hh*60+mm;
}

function wmoMap(code,cloud){
  code=+code;
  const M=o=>Object.assign({label:'',sky:'clear',precip:'none',intensity:0,fog:false,storm:false},o);
  const T={0:M({label:'Clear',sky:'clear'}),1:M({label:'Mainly clear',sky:'clear'}),
    2:M({label:'Partly cloudy',sky:'cloudy'}),3:M({label:'Overcast',sky:'overcast'}),
    45:M({label:'Fog',sky:'overcast',fog:true}),48:M({label:'Rime fog',sky:'overcast',fog:true}),
    51:M({label:'Light drizzle',sky:'overcast',precip:'rain',intensity:1}),
    53:M({label:'Drizzle',sky:'overcast',precip:'rain',intensity:1}),
    55:M({label:'Heavy drizzle',sky:'overcast',precip:'rain',intensity:2}),
    56:M({label:'Freezing drizzle',sky:'overcast',precip:'sleet',intensity:1}),
    57:M({label:'Freezing drizzle',sky:'overcast',precip:'sleet',intensity:2}),
    61:M({label:'Light rain',sky:'overcast',precip:'rain',intensity:1}),
    63:M({label:'Rain',sky:'overcast',precip:'rain',intensity:2}),
    65:M({label:'Heavy rain',sky:'overcast',precip:'rain',intensity:3}),
    66:M({label:'Freezing rain',sky:'overcast',precip:'sleet',intensity:2}),
    67:M({label:'Freezing rain',sky:'overcast',precip:'sleet',intensity:3}),
    71:M({label:'Light snow',sky:'overcast',precip:'snow',intensity:1}),
    73:M({label:'Snow',sky:'overcast',precip:'snow',intensity:2}),
    75:M({label:'Heavy snow',sky:'overcast',precip:'snow',intensity:3}),
    77:M({label:'Snow grains',sky:'overcast',precip:'snow',intensity:1}),
    80:M({label:'Light showers',sky:'cloudy',precip:'rain',intensity:1}),
    81:M({label:'Rain showers',sky:'cloudy',precip:'rain',intensity:2}),
    82:M({label:'Violent showers',sky:'overcast',precip:'rain',intensity:3}),
    85:M({label:'Snow showers',sky:'cloudy',precip:'snow',intensity:2}),
    86:M({label:'Heavy snow showers',sky:'overcast',precip:'snow',intensity:3}),
    95:M({label:'Thunderstorm',sky:'overcast',precip:'rain',intensity:2,storm:true}),
    96:M({label:'Storm w/ hail',sky:'overcast',precip:'rain',intensity:3,storm:true}),
    99:M({label:'Severe storm',sky:'overcast',precip:'rain',intensity:3,storm:true})};
  return T[code] || M({label:'—',sky: cloud>80?'overcast':cloud>40?'cloudy':'clear'});
}
function wxIcon(wx,isDay){
  if(wx.storm)return '⛈️'; if(wx.fog)return '🌫️';
  if(wx.precip==='snow')return '🌨️'; if(wx.precip==='sleet')return '🌧️';
  if(wx.precip==='rain')return isDay?'🌦️':'🌧️';
  if(wx.sky==='overcast')return '☁️';
  if(wx.sky==='cloudy')return isDay?'⛅':'☁️';
  return isDay?'☀️':'🌙';
}

function phaseFor(m,rise,set){
  if(m<rise-45||m>set+45)return 'night';
  if(m<rise+30)return 'dawn';
  if(m>set+15)return 'dusk';
  if(m>set-15)return 'sunset';
  if(m>set-75)return 'golden';
  const mid=(rise+set)/2;
  if(Math.abs(m-mid)<160)return 'midday';
  return 'morning';
}

function computeScene(){
  const m=medoraMinutes(), rise=sunTimes.rise, set=sunTimes.set;
  const phase=phaseFor(m,rise,set);
  const dayLight=m>=rise-20 && m<=set+20;
  const wx=WXDATA?WXDATA.wx:wmoMap(0,0);

  let bg=SKY[phase];
  if(wx.storm) bg=dayLight?SKYW.stormDay:SKYW.stormNight;
  else if(wx.precip==='snow') bg=dayLight?SKYW.snowDay:SKYW.snowNight;
  else if(wx.fog||wx.sky==='overcast'){
    bg = wx.precip!=='none' ? (dayLight?SKYW.precipDay:SKYW.precipNight)
                            : (dayLight?SKYW.overcastDay:SKYW.overcastNight);
  } else if(wx.precip!=='none') bg=dayLight?SKYW.precipDay:SKYW.precipNight;
  document.getElementById('sky').style.background=bg;

  const darkness=(phase==='night')?1:(phase==='dawn'||phase==='dusk')?0.5:0;
  const cloudHide=(wx.sky==='overcast'||wx.storm||wx.fog)?0.12:(wx.sky==='cloudy'?0.55:1);
  document.getElementById('stars').style.opacity=(darkness*cloudHide).toFixed(2);

  placeCelestial(m,rise,set,dayLight,wx);
  renderClouds(wx,dayLight);
  renderPrecip(wx);
  document.getElementById('fog').style.opacity=wx.fog?1:0;
  scheduleLightning(wx.storm);
  updateChip(wx);
}

function placeCelestial(m,rise,set,dayLight,wx){
  const c=document.getElementById('celestial'); let html='';
  if(dayLight){
    const frac=Math.min(1,Math.max(0,(m-rise)/Math.max(1,set-rise)));
    const x=6+88*frac, elev=Math.sin(frac*Math.PI), y=54-elev*42;
    const warm=elev<0.28, core=warm?'#ffd17a':'#fff2cf', glow=warm?'#f4a04a':'#ffd06a';
    html=`<div class="orb" style="left:${x}%;top:${y}%;width:clamp(120px,16vw,240px);height:clamp(120px,16vw,240px);background:radial-gradient(circle,${glow}cc 0%,${glow}55 38%,transparent 66%)"></div>
      <div class="orb" style="left:${x}%;top:${y}%;width:clamp(34px,4.4vw,70px);height:clamp(34px,4.4vw,70px);background:radial-gradient(circle at 42% 38%,#fff,${core});box-shadow:0 0 42px ${glow}"></div>`;
    c.style.opacity= wx.storm?0:(wx.fog?0.12:(wx.sky==='overcast'?0.22:(wx.sky==='cloudy'?0.85:1)));
  } else {
    const span=(1440-set)+rise; let mm=m; if(mm<rise)mm+=1440;
    const frac=Math.min(1,Math.max(0,(mm-set)/Math.max(1,span)));
    const x=8+84*frac, elev=Math.sin(frac*Math.PI), y=54-elev*40;
    html=`<div class="orb" style="left:${x}%;top:${y}%;width:clamp(62px,7.6vw,120px);height:clamp(62px,7.6vw,120px);background:radial-gradient(circle,#cfd8e6aa 0%,#cfd8e633 42%,transparent 66%)"></div>
      <div class="orb" style="left:${x}%;top:${y}%;width:clamp(26px,3.2vw,52px);height:clamp(26px,3.2vw,52px);background:radial-gradient(circle at 38% 36%,#f4f7fb,#c3ccd8);box-shadow:0 0 26px #aeb9caaa"></div>`;
    c.style.opacity= wx.storm?0.12:((wx.fog||wx.sky==='overcast')?0.3:1);
  }
  c.innerHTML=html;
}

let cloudSig='';
function renderClouds(wx,dayLight){
  let n={clear:0,cloudy:4,overcast:9}[wx.sky]||0; if(wx.storm)n=10;
  const windK=WXDATA?WXDATA.windK:0;
  const sig=wx.sky+'|'+wx.storm+'|'+dayLight+'|'+Math.round(windK*3);
  if(sig===cloudSig)return; cloudSig=sig;
  const el=document.getElementById('clouds');
  if(n===0){el.innerHTML='';return;}
  const dark=wx.storm?'#2a2f35':(dayLight?'#c9d2d6':'#333b41');
  const light=wx.storm?'#3a4149':(dayLight?'#eef2f4':'#454e55');
  const op=(wx.sky==='overcast'||wx.storm)?0.9:0.68;
  let h='';
  for(let i=0;i<n;i++){
    const w=(180+Math.random()*260)|0, hh=(w*0.42)|0, top=(4+Math.random()*34).toFixed(1);
    const dur=((38+Math.random()*40)/(1+windK)).toFixed(1), delay=(-Math.random()*dur).toFixed(1);
    h+=`<div class="cloud" style="width:${w}px;height:${hh}px;top:${top}%;background:radial-gradient(circle at 40% 45%,${light},${dark});opacity:${op};animation-duration:${dur}s;animation-delay:${delay}s"></div>`;
  }
  el.innerHTML=h;
}

let precipSig='';
function renderPrecip(wx){
  const wind=WXDATA?WXDATA.wind:6;
  const sig=wx.precip+'|'+wx.intensity+'|'+Math.round(wind/6);
  if(sig===precipSig)return; precipSig=sig;
  const el=document.getElementById('precip');
  const lean=Math.max(-18,Math.min(18,(wind-4)*(wx.precip==='snow'?0.5:1.1)));
  el.style.transform=`rotate(${lean.toFixed(0)}deg) scale(1.3)`;
  if(wx.precip==='none'){el.innerHTML='';return;}
  const n={1:60,2:110,3:170}[wx.intensity]||80;
  let h='';
  if(wx.precip==='snow'){
    for(let i=0;i<n;i++){
      const x=(Math.random()*100).toFixed(2), sz=(2+Math.random()*3).toFixed(1);
      const dur=(6+Math.random()*6).toFixed(1), delay=(-Math.random()*8).toFixed(1);
      const dx=((Math.random()*30-10)).toFixed(0);
      h+=`<div class="flake" style="left:${x}%;width:${sz}px;height:${sz}px;opacity:${(0.5+Math.random()*0.5).toFixed(2)};--dx:${dx}px;animation-duration:${dur}s;animation-delay:${delay}s"></div>`;
    }
  } else {
    const sleet=wx.precip==='sleet';
    for(let i=0;i<n;i++){
      const x=(Math.random()*100).toFixed(2);
      const len=(sleet?(6+Math.random()*6):(12+Math.random()*16)).toFixed(0);
      const dur=((sleet?0.5:0.35)+Math.random()*0.35).toFixed(2), delay=(-Math.random()).toFixed(2);
      h+=`<div class="drop" style="left:${x}%;height:${len}px;animation-duration:${dur}s;animation-delay:${delay}s;opacity:${(0.4+Math.random()*0.5).toFixed(2)}"></div>`;
    }
  }
  el.innerHTML=h;
}

let stormOn=false, boltTimer=null;
function scheduleLightning(on){
  if(on===stormOn)return; stormOn=on;
  if(boltTimer){clearTimeout(boltTimer);boltTimer=null;}
  if(!on)return;
  const flash=document.getElementById('flash');
  const bolt=()=>{ flash.classList.remove('zap'); void flash.offsetWidth; flash.classList.add('zap');
    boltTimer=setTimeout(bolt,4000+Math.random()*9000); };
  boltTimer=setTimeout(bolt,2000+Math.random()*4000);
}

function updateChip(wx){
  const chip=document.getElementById('wxChip'); if(!chip)return;
  if(!WXDATA){chip.style.display='none';return;}
  chip.style.display='flex';
  chip.innerHTML=`<span class="ic">${wxIcon(wx,WXDATA.isDay)}</span><span><span class="tp">${Math.round(WXDATA.temp)}°F</span> <span class="ds">Medora · ${wx.label||WXDATA.desc}</span></span>`;
}

async function fetchWeather(){
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${GEO.lat}&longitude=${GEO.lon}&current=temperature_2m,weather_code,wind_speed_10m,cloud_cover,is_day,precipitation&daily=sunrise,sunset&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FChicago&forecast_days=1`;
    const r=await fetch(u); const d=await r.json(); const cur=d.current;
    const wx=wmoMap(cur.weather_code,cur.cloud_cover);
    WXDATA={wx,temp:cur.temperature_2m,wind:cur.wind_speed_10m,windK:Math.min(1.6,(cur.wind_speed_10m||0)/25),cloud:cur.cloud_cover,isDay:cur.is_day===1,desc:wx.label};
    if(d.daily&&d.daily.sunrise){const rs=minsFromISO(d.daily.sunrise[0]),ss=minsFromISO(d.daily.sunset[0]); if(rs!=null)sunTimes.rise=rs; if(ss!=null)sunTimes.set=ss;}
    cloudSig='';precipSig='';
  }catch(e){/* offline: keep time-of-day, default clear */}
  computeScene();
}

    <div class="card"><div class="lbl">People reached</div><div class="val">61,200</div><div class="foot">Tours, programs & this display</div></div>
    <div class="card"><div class="lbl">Education programs</div><div class="val">48</div><div class="foot">This year</div></div>
    <div class="card"><div class="lbl">Biophilic features</div><div class="val">17</div><div class="foot">Documented elements</div></div>
    <div class="card"><div class="lbl">Recognition</div><div class="val">5</div><div class="foot">Awards & press</div></div></div>`;}
  return '';
}
let current=null;
function setActiveTile(id){
  document.querySelectorAll('.petal-tile').forEach(t=>{
    const on=t.getAttribute('data-pid')===id;
    t.classList.toggle('active',!!id&&on);
    t.classList.toggle('dimmed',!!id&&!on);
  });
}
function openDetail(id){
  if(current&&current.id===id){closeDetail();return;} // click active petal again = back to overview
  const p=PETALS.find(x=>x.id===id);current=p;
  document.getElementById('kpis').style.display='none';
  document.getElementById('headlineStrip').style.display='none';
  document.getElementById('detail').classList.add('open');
  setActiveTile(id);
  const tag=p.status==='live'?'<span class="d-tag live">Live metered</span>':p.status==='cap'?'<span class="d-tag cap">Live-capable</span>':'<span class="d-tag doc">Documented</span>';
  const imps=p.imperatives.map(i=>`<span class="imp">${i}</span>`).join('');
  const track=p.track.map(t=>`<li style="--pc:${p.color}"><span class="dot">▸</span><span><strong>${t[0]}</strong> — <span class="k">${t[1]}</span></span></li>`).join('');
  const src=p.status==='live'?'Fed live by EcoStruxure (PME / EBO).':p.status==='cap'?'Can go live now — reads the same EcoStruxure building sensors.':'Maintained in the LBC Petal Tracker workbook; values shown are illustrative targets.';
  document.getElementById('dbody').innerHTML=`
    <div class="d-top" style="padding:0 0 4px">
      <div class="bubble" style="background:${p.color}22;border:1px solid ${p.color}">${p.icon}</div>
      <h2>${p.name} Petal ${tag}</h2>
    </div>
    <div class="imps">${imps}</div>
    <div class="tagline">${p.tagline}</div>
    <div class="cols">
      <div>
        <div class="seclabel">What we'd show — sample visualization</div>
        <div id="vizSlot">${vizHTML(p)}</div>
      </div>
      <div>
        <div class="seclabel">What we track</div>
        <ul class="track-list" style="--pc:${p.color}">${track}</ul>
      </div>
    </div>
    <div class="seclabel">The public story</div>
    <div class="show-box" style="--pc:${p.color}">${p.show}</div>
    <div class="src-note">${src}</div>`;
  document.getElementById('detail').classList.add('open');
}
function closeDetail(){
  current=null;
  document.getElementById('detail').classList.remove('open');
  document.getElementById('kpis').style.display='';
  document.getElementById('headlineStrip').style.display='';
  setActiveTile(null);
}
window.openDetail=openDetail;window.closeDetail=closeDetail;

/* ================= LOOP ================= */
function clock(){const n=new Date();
  document.getElementById('clock').textContent=n.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('date').textContent=n.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});}
function loop(){tickDemo();renderKPIs();refreshRail();
  if(current&&(current.status==='live'||current.status==='cap'))document.getElementById('vizSlot').innerHTML=vizHTML(current);}
buildScene();
document.getElementById('dscene').innerHTML=terrainSVG();
computeScene();
fetchWeather();
setInterval(computeScene,60000);
setInterval(fetchWeather,600000);
buildRail();clock();tickDemo();renderKPIs();refreshRail();
setInterval(clock,1000);setInterval(loop,CONFIG.refreshMs);

/* ===== kiosk: return to overview after 2 min of inactivity ===== */
const IDLE_MS=120000; let idleTimer=null;
function resetIdle(){ if(idleTimer)clearTimeout(idleTimer);
  idleTimer=setTimeout(()=>{ if(typeof current!=='undefined' && current) closeDetail(); }, IDLE_MS); }
['pointerdown','pointermove','click','keydown','wheel','touchstart']
  .forEach(ev=>document.addEventListener(ev,resetIdle,{passive:true}));
resetIdle();
</script>
